<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking — Tony Kansai Guide</title>
  <style>
    body { margin: 0; background: #0C0D16; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .card { background: #12141F; border: 1px solid rgba(229,48,48,0.2); border-radius: 16px; padding: 40px 48px; text-align: center; max-width: 400px; }
    h1 { color: #fff; font-size: 1.5rem; margin: 0 0 8px; }
    p { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 0 0 24px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(to right, #E53030, #FF6B35); color: #fff; font-weight: 600; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; }
  </style>
  <script>
    const TOURS = [
      'Osaka Food Circuit',       // route=0
      'Hidden Kyoto',             // route=1
      'Kobe Refined',             // route=2
      'Nara Sacred Forest',       // route=3
      'Kōyasan Pilgrimage',       // route=4
      'Osaka × Kyoto Grand Day',  // route=5
      'Mountain Hiking',          // route=6
    ]
    const PRICES = ['¥75,000', '¥95,000', '¥85,000', '¥98,000', '¥165,000', '¥130,000', '¥108,000']
    const WA = 'https://wa.me/34634193106'

    // Esta página sólo se ve un segundo y medio antes de saltar a WhatsApp,
    // pero el mensaje que se envía sí se queda: va en el idioma del visitante.
    const T = {
      en:{ redir:'Redirecting you to WhatsApp to book with Tony…', open:'Open WhatsApp',
           per:' per group', load:'Loading…',
           msg:(n,p) => `Hi Tony! I'd like to book the "${n}" tour (${p}). Can you share availability and details?` },
      es:{ redir:'Te llevamos a WhatsApp para reservar con Tony…', open:'Abrir WhatsApp',
           per:' por grupo', load:'Cargando…',
           msg:(n,p) => `¡Hola, Tony! Me gustaría reservar el tour «${n}» (${p}). ¿Me dices disponibilidad y detalles?` },
      ar:{ redir:'نحوّلك إلى واتساب لتحجز مع طوني…', open:'افتح واتساب',
           per:' للمجموعة', load:'جارٍ التحميل…',
           msg:(n,p) => `مرحباً طوني! أودّ حجز جولة «${n}» (${p}). هل تخبرني بالمواعيد المتاحة والتفاصيل؟` },
      ru:{ redir:'Перенаправляем вас в WhatsApp для брони у Тони…', open:'Открыть WhatsApp',
           per:' за группу', load:'Загрузка…',
           msg:(n,p) => `Здравствуйте, Тони! Хочу забронировать тур «${n}» (${p}). Подскажите даты и детали?` },
      cs:{ redir:'Přesměrováváme vás na WhatsApp k rezervaci u Tonyho…', open:'Otevřít WhatsApp',
           per:' za skupinu', load:'Načítání…',
           msg:(n,p) => `Dobrý den, Tony! Rád bych si rezervoval prohlídku „${n}" (${p}). Můžete mi napsat termíny a detaily?` },
    }
    const RTL = { ar: true }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search)
      const route = Math.max(0, Math.min(6, parseInt(params.get('route') || '0', 10)))
      const name = TOURS[route]
      const price = PRICES[route]

      const pedido = (params.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase()
      const lang = T[pedido] ? pedido : 'en'
      const t = T[lang]
      document.documentElement.lang = lang
      document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr'

      document.getElementById('tour-name').textContent = name
      document.getElementById('tour-price').textContent = price + t.per
      document.getElementById('redir').textContent = t.redir
      document.getElementById('open-label').textContent = t.open

      const msg = encodeURIComponent(t.msg(name, price))
      document.getElementById('wa-link').href = `${WA}?text=${msg}`

      // Auto-redirect after 1.8s for a seamless experience
      setTimeout(() => { window.location.href = `${WA}?text=${msg}` }, 1800)
    })
  </script>
</head>
<body>
  <div class="card">
    <h1 id="tour-name">Loading…</h1>
    <p id="tour-price"></p>
    <p id="redir">Redirecting you to WhatsApp to book with Tony…</p>
    <a id="wa-link" class="btn" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </svg>
      <span id="open-label">Open WhatsApp</span>
    </a>
  </div>
</body>
</html>
