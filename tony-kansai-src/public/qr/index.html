<title>Tony Kansai Guide</title>
<script>
// QR de la tarjeta de metal: SIEMPRE la página de Tony, salvo que el idioma del
// teléfono lo hable otro guía (ruso → Larion, francés → Iheb, turco → Ferhat).
// A propósito ignora la página guardada de visitas anteriores (v7-pagina), que
// mandaba a quien había visto la de Larion a la rusa.
(function () {
  var MAPA = { es: '/es/', en: '/en/', ar: '/ar/', fr: '/fr/', tr: '/tr/',
               ru: '/ru/', uk: '/ru/', be: '/ru/', kk: '/ru/', uz: '/ru/', hy: '/ru/', ka: '/ru/' };
  var destino = '/en/';
  try {
    var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < tags.length; i++) {
      var b = String(tags[i]).split('-')[0].toLowerCase();
      if (MAPA[b]) { destino = MAPA[b]; break; }
    }
  } catch (e) {}
  location.replace(destino);
})();
</script>
