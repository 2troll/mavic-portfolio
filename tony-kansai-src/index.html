<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Tony Hanma — Private Kansai Guide · Japan</title>
    <meta name="description" content="100% private tours in Osaka, Kyoto, Nara &amp; Kansai. Expert guides in English, Spanish, Arabic and Russian. Book your Japan experience today." />
    <meta name="robots" content="index, follow" />

    <!-- Seguridad y privacidad del navegador. GitHub Pages no deja poner
         cabeceras, así que lo que se puede declarar va aquí. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="canonical" href="https://tonykansaiguide.com/" />

    <!-- hreflang de la portada: cada idioma tiene su página (web v7). En las
         demás rutas el despliegue borra estas líneas y el sitemap las declara. -->
    <link rel="alternate" hreflang="es" href="https://tonykansaiguide.com/es/" />
    <link rel="alternate" hreflang="en" href="https://tonykansaiguide.com/en/" />
    <link rel="alternate" hreflang="ar" href="https://tonykansaiguide.com/ar/" />
    <link rel="alternate" hreflang="ru" href="https://tonykansaiguide.com/ru/" />
    <link rel="alternate" hreflang="x-default" href="https://tonykansaiguide.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tonykansaiguide.com/" />
    <meta property="og:title" content="Tony Hanma — Private Japan Guide · Kansai" />
    <meta property="og:description" content="100% private tours in Osaka, Kyoto &amp; Kansai. Guided in English, Spanish, Arabic and Russian. The Japan you deserve." />
    <meta property="og:image" content="https://tonykansaiguide.com/v8/og/es.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fushimi Inari torii gates at dawn in Kyoto, Japan" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:site_name" content="Tony Kansai Guide" />

    <!-- Twitter Card (also used by iMessage, Telegram, etc.) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tony Hanma — Private Japan Guide · Kansai" />
    <meta name="twitter:description" content="100% private tours in Osaka, Kyoto &amp; Kansai. Guided in English, Spanish, Arabic and Russian." />
    <meta name="twitter:image" content="https://tonykansaiguide.com/v8/og/es.jpg" />

    <!-- JSON-LD: LocalBusiness + TourOperator -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "TouristInformationCenter"],
      "name": "Tony Hanma Private Kansai Tours",
      "description": "100% private guided tours in Osaka, Kyoto, Nara and Kansai Japan in English, Spanish, Arabic and Russian.",
      "url": "https://tonykansaiguide.com",
      "telephone": "+819024585949",
      "priceRange": "¥38,000–¥70,000",
      "email": "tony@tonykansaiguide.com",
      "image": "https://tonykansaiguide.com/v7/fotos/kioto.jpg",
      "areaServed": [
        { "@type": "City", "name": "Osaka" },
        { "@type": "City", "name": "Kyoto" },
        { "@type": "City", "name": "Nara" },
        { "@type": "City", "name": "Kobe" },
        { "@type": "City", "name": "Himeji" },
        { "@type": "Place", "name": "Kōyasan" },
        { "@type": "City", "name": "Hiroshima" },
        { "@type": "Place", "name": "Miyajima" }
      ],
      "availableLanguage": [
        { "@type": "Language", "name": "English" },
        { "@type": "Language", "name": "Spanish" },
        { "@type": "Language", "name": "Arabic" },
        { "@type": "Language", "name": "Russian" }
      ]
    }
    </script>


    <!-- Google Consent Mode v2: default denied until user accepts cookie banner -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        wait_for_update: 500
      });
    </script>

    <!-- Google Analytics 4 + Google Ads -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18180560747"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-K9JKN9346D');
      gtag('config', 'AW-18180560747');
    </script>

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tony Admin" />
    <!-- Barra del navegador del color del fondo: el gris claro de la web v7
         (antes era rojo y teñía la barra de Safari encima de una página clara). -->
    <meta name="theme-color" content="#f5f5f7" />

    <!-- Fondo correcto antes de que cargue React. Sin esto, con el Mac en modo
         oscuro se veía un fogonazo negro (el fondo antiguo de body) antes de la
         página clara, y el rebote del scroll en iPhone enseñaba una franja negra.
         Las páginas antiguas (oscuras) se marcan aquí para no dar el fogonazo al
         revés; una vez montada la app manda index.css (html:has(...)). -->
    <style>
      html { background: #f5f5f7; color-scheme: light; }
      html.web-oscura { background: #050508; color-scheme: dark; }
    </style>
    <script>
      if (/^\/(tours|pricing|about|faq|booking|book|guide|guides|hiking|admin)(\/|$)/.test(location.pathname)) {
        document.documentElement.classList.add('web-oscura');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#050508');
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sin bloquear el primer pintado: las páginas de idioma (v7) usan la
         letra del sistema; sólo las páginas antiguas usan estas. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
