name: Build & Deploy

on:
  push:
    branches:
      - main
      - claude/premium-3d-portfolio-rebuild-Qom7g
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Build Mavic Portfolio ──────────────────────────────
      - name: Install mavic dependencies
        run: npm ci

      - name: Build mavic portfolio
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: SPA fallback
        run: cp dist/index.html dist/200.html

      # ── Build Tony Kansai Guide (root of domain) ──────────
      - name: Install tony-kansai dependencies
        run: npm install --legacy-peer-deps
        working-directory: tony-kansai-src

      - name: Build tony-kansai guide
        run: npm run build
        working-directory: tony-kansai-src
        env:
          VITE_SINGLE_FILE: 'true'

      - name: Fix tony-kansai inline scripts
        run: |
          sed -i 's/<script type="module" crossorigin>/<script type="module">/g' tony-kansai-src/dist/index.html

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp -r tony-kansai-src/dist/. deploy/
          echo "tonykansaiguide.com" > deploy/CNAME
          cp deploy/index.html deploy/404.html

      # GitHub Pages responde 404 a cualquier ruta que no sea un fichero real.
      # El 404.html de arriba hace que el visitante VEA la página (React Router
      # se encarga), pero el estado sigue siendo 404 y Google no indexa un 404:
      # /tours, /about y las 25 restantes del sitemap eran invisibles en el
      # buscador. Creando un index.html de verdad por cada ruta, responden 200.
      # Se toma la lista del propio sitemap.xml para que nunca se desincronicen.
      - name: Rutas reales para el SPA (indexables por Google)
        run: |
          grep -oE '<loc>[^<]*</loc>' deploy/sitemap.xml \
            | sed -E 's|</?loc>||g; s|https://tonykansaiguide\.com||; s|^/||; s|/$||' \
            | grep -v '^$' \
            | while read -r ruta; do
                # Las que ya son un fichero real (resenas.html, booking.html…)
                # responden 200 por sí solas: no hay que inventarles carpeta,
                # y hacerlo rompería el despliegue con un choque de nombres.
                if [ -e "deploy/$ruta" ]; then continue; fi
                mkdir -p "deploy/$ruta"
                cp deploy/index.html "deploy/$ruta/index.html"
                echo "  200 -> /$ruta"
              done

      # ── Deploy to GitHub Pages ─────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
