name: Build & Deploy

on:
  push:
    branches:
      - main
      - claude/premium-3d-portfolio-rebuild-Qom7g
  workflow_dispatch:
  # Cada día a las 06:00 JST: las reseñas que los clientes mandan (Tony, Larion,
  # Ferhat) se publican al instante con JS, pero las IAs solo leen el HTML del build.
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: build-sitemap.mjs saca el <lastmod> de cada página de
          # su último commit; con el clon superficial todas salían con la misma fecha.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Build Mavic Portfolio ──────────────────────────────
      - name: Install mavic dependencies
        run: npm ci

      - name: Build mavic portfolio
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: SPA fallback
        run: cp dist/index.html dist/200.html

      # ── Build Tony Kansai Guide (root of domain) ──────────
      - name: Install tony-kansai dependencies
        run: npm install --legacy-peer-deps
        working-directory: tony-kansai-src

      # Build normal por trozos (antes era un solo HTML de 1,6 MB con todo
      # dentro: la foto de portada tardaba ~20 s en móvil lento, y el modo
      # single-file reescribía las rutas a relativas y rompía el manifest).
      # Las reseñas aprobadas desde el móvil (Worker) entran en el HTML y el
      # JSON-LD: si no, ni Google ni las IAs las ven.
      - name: Reseñas del Worker dentro del build
        run: node scripts/resenas-worker.mjs
        working-directory: tony-kansai-src

      - name: Build tony-kansai guide
        run: npm run build
        working-directory: tony-kansai-src

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp -r tony-kansai-src/dist/. deploy/
          echo "tonykansaiguide.com" > deploy/CNAME
          cp deploy/index.html deploy/404.html

      # GitHub Pages responde 404 a cualquier ruta que no sea un fichero real.
      # El 404.html de arriba hace que el visitante VEA la página (React Router
      # se encarga), pero el estado sigue siendo 404 y Google no indexa un 404:
      # /tours, /about y las 25 restantes del sitemap eran invisibles en el
      # buscador. Creando un index.html de verdad por cada ruta, responden 200.
      # Se toma la lista del propio sitemap.xml para que nunca se desincronicen.
      - name: Rutas reales con su propia cabecera (Google y WhatsApp)
        working-directory: tony-kansai-src
        run: node scripts/rutas-estaticas.mjs ../deploy

      # Texto limpio para asistentes de IA: <ruta>/index.md y /llms-full.txt.
      - name: Textos para IA (index.md y llms-full.txt)
        working-directory: tony-kansai-src
        run: node scripts/textos-ia.mjs ../deploy

      # ── Deploy to GitHub Pages ─────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Avisa a Bing (y a ChatGPT, que busca con Bing) de las páginas cambiadas.
      # Si IndexNow falla, la web ya está publicada: no se marca el despliegue como roto.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tony-kansai-src/scripts/indexnow.mjs
      - name: IndexNow (páginas cambiadas)
        continue-on-error: true
        run: sleep 60 && node tony-kansai-src/scripts/indexnow.mjs --recientes
